# Lets `pre-commit` (and `pip install git+https://...`) install the CLI from the repo root.
# The code lives in cli/; keep this in step with cli/pyproject.toml. No requires-python here on
# purpose: ruff reads it to pick the Python version it lints api/ for.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brandlint-cli"
version = "0.1.0"
description = "Check the copy in a repo against your BrandLint rulebook, locally and in CI."
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
brandlint = "brandlint_cli.cli:main"

[tool.setuptools.packages.find]
where = ["cli/src"]
