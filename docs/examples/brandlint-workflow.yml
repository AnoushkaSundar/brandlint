# Example: BrandLint reviewing this repository's own copy before it merges (see docs/ci.md).
# Copy this to .github/workflows/brandlint.yml. It runs only for pull requests that change
# files under copy/. Add the secrets BRANDLINT_URL, BRANDLINT_EMAIL and BRANDLINT_PASSWORD to
# turn it on, then make "brandlint / copy" a required check so it can block merges.
name: brandlint
on:
  pull_request:
    paths: ["copy/**"]
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS: ${{ secrets.BRANDLINT_URL != '' && secrets.BRANDLINT_PASSWORD != '' }}
    steps:
      - name: Say so when BrandLint isn't set up
        if: env.HAVE_SECRETS != 'true'
        run: echo "::warning::BrandLint secrets aren't set, so this copy was NOT reviewed."
      - uses: actions/checkout@v4
        if: env.HAVE_SECRETS == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/brandlint
        if: env.HAVE_SECRETS == 'true'
        with:
          url: ${{ secrets.BRANDLINT_URL }}
          email: ${{ secrets.BRANDLINT_EMAIL }}
          password: ${{ secrets.BRANDLINT_PASSWORD }}
          paths: "copy/**"
          channel: blog
          fail-on: medium
