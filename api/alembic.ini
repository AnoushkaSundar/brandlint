# Alembic config for BrandLint. The database URL is injected from app.db at
# runtime (see migrations/env.py), so it is intentionally blank here and no
# secrets live in this file.
[alembic]
script_location = migrations
prepend_sys_path = .
# Migration files are prefixed per owner: alapan_* / anoushka_*.
# Rebase on main before generating; if two heads appear, whoever merges
# second runs `alembic merge heads` in the same PR.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
