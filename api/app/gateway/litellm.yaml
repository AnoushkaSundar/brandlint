# LiteLLM proxy config. Provider keys come from .env.litellm, which only the
# litellm service reads. Change the model names here and in LLM_MODEL together:
# they are part of the verdict cache key.
# Haiku 4.5, not 5.5: tier-1 verdicts need temperature 0, and Anthropic rejects
# `temperature` on Haiku 5.5.
model_list:
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
