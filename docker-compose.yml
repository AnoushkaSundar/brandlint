# BrandLint local dev stack.
#
#   docker compose up --build            # core path: db, api, web, litellm, presidio
#   docker compose --profile local-llm up   # + ollama  (restricted-data route)
#   docker compose --profile graph up       # + neo4j   (graph view)
#   docker compose --profile full up        # everything
#
# Heavier optional services (ollama, neo4j) sit behind profiles so the default
# `up` stays light. All images are pinned to exact versions. LiteLLM is pinned
# by digest as well and must stay hash-verified — NEVER use 1.82.7 or 1.82.8
# (malicious releases, March 2026).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brandlint
      POSTGRES_PASSWORD: brandlint
      POSTGRES_DB: brandlint
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandlint -d brandlint"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI app (app.main:app). Build context is the repo root so the image can
  # install requirements/ and copy api/. demo/ is mounted read-only for the mock
  # endpoints (they read it via DEMO_DIR).
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://brandlint:brandlint@db:5432/brandlint
      LITELLM_URL: http://litellm:4000
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      WEB_ORIGIN: http://localhost:3000
      DEMO_DIR: /demo
      UPLOAD_DIR: /uploads
    volumes:
      - ./demo:/demo:ro
      - ./eval:/eval:ro
      - uploads:/uploads
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Next.js app (Anoushka owns ./web). Dockerfile lands with the web shell.
  web:
    build: ./web
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # LiteLLM proxy — the ONLY component that holds provider keys.
  # Pinned by tag AND digest. Verify the digest before changing the version.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.66.0-stable@sha256:1ae3674b699ac5f4abfd55172359322270f35eaad9788e5ca02c0df9616623f2
    command: ["--config", "/app/litellm.yaml", "--port", "4000"]
    # Do NOT give this service .env: if it sees DATABASE_URL, LiteLLM runs
    # `prisma db push --accept-data-loss` against that database, which is ours.
    env_file:
      # Provider keys. Only this service reads this file, so they never reach
      # api or web. Never add it to another service.
      - path: .env.litellm
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Use the model map pinned in the image, not one downloaded at startup.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./api/app/gateway/litellm.yaml:/app/litellm.yaml:ro
    ports: ["4000:4000"]

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    ports: ["5002:3000"]

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    ports: ["5001:3000"]

  # --- optional, profile-gated ---
  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["local-llm", "full"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  neo4j:
    image: neo4j:5.26.32-community
    profiles: ["graph", "full"]
    environment:
      NEO4J_AUTH: neo4j/brandlint
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]

volumes:
  pgdata:
  ollama:
  neo4jdata:
  uploads:
