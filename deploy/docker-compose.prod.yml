# Public demo, layered on the main compose file:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. The database, LiteLLM (which holds the model keys) and
# Presidio stay on the internal network. Docker bypasses the server's own firewall, so
# the cloud firewall must also allow only 22, 80 and 443.
services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, such as 203.0.113.7.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/judge-pack:/srv/judge:ro
      - ./demo/brand:/srv/judge-files/brand:ro
      - ./demo/pieces:/srv/judge-files/pieces:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      WEB_ORIGIN: https://${SITE_HOST}
      COOKIE_SECURE: "true"
      # The API connects as brandlint_app, which Row-Level Security applies to. Superusers
      # and the table owner bypass it, so the API must never connect as either. Migrations
      # and the seeds run as the owner, through MIGRATION_DATABASE_URL (see docs/rls.md).
      DATABASE_URL: postgresql+psycopg://brandlint_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env, from openssl rand -hex 24}@db:5432/brandlint
      MIGRATION_DATABASE_URL: postgresql+psycopg://brandlint:brandlint@db:5432/brandlint
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Workspace signup is off until the rollout in deploy/README.md turns it on. Caddy
      # appends the real client address, which the signup rate limit reads.
      MULTI_TENANT_SIGNUP: ${MULTI_TENANT_SIGNUP:-false}
      TRUST_PROXY: "true"
      # The CI/CD integration (docs/ci-integration.md) is off until the rollout in deploy/README.md.
      CI_INTEGRATION_ENABLED: ${CI_INTEGRATION_ENABLED:-false}
      CI_BASE_URL: https://${SITE_HOST}
      USE_MOCK_ENGINE: "false"
      USE_MOCK_GATEWAY: "false"
      USE_MOCK_MEMORY: "false"
    volumes:
      - ./deploy:/deploy:ro

  web:
    restart: unless-stopped
    ports: !reset []
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${SITE_HOST}/api
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_MULTI_TENANT_SIGNUP: ${MULTI_TENANT_SIGNUP:-false}
        NEXT_PUBLIC_CI_ENABLED: ${CI_INTEGRATION_ENABLED:-false}

  db:
    restart: unless-stopped
    ports: !reset []

  litellm:
    restart: unless-stopped
    ports: !reset []

  presidio-analyzer:
    restart: unless-stopped
    ports: !reset []

  presidio-anonymizer:
    restart: unless-stopped
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
