name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_llm_imports.sh
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/base.txt
      - run: ruff check api
      - run: pytest api -q || [ $? -eq 5 ]   # exit 5 = no tests collected yet
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the Next.js app exists
        id: has_web
        run: |
          if [ -f web/package.json ]; then echo "yes=true" >> $GITHUB_OUTPUT; else echo "yes=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.yes == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has_web.outputs.yes == 'true'
        working-directory: web
        run: npm ci && npm run lint && npm run build
