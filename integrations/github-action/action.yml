name: BrandLint
description: Check the copy a pull request changed against your BrandLint rulebook.

inputs:
  server:
    description: The BrandLint API address, such as https://brandlint.example/api.
    required: true
  token:
    description: A BrandLint service token. Pass it from a secret; it is masked in logs.
    required: true
  config:
    description: Path to the repo's .brandlint.yml.
    default: .brandlint.yml
  fail-on:
    description: "violations (default) fails the check on a blocking finding; none only reports."
    default: violations
  on-error:
    description: "fail (default) or pass: what to do when BrandLint can not be reached."
    default: fail
  on-fork:
    description: "fail (default) or skip: a fork pull request has no secrets, so the check can not run."
    default: fail
  github-token:
    description: Used only to keep one comment up to date on the pull request.
    default: ${{ github.token }}

outputs:
  result:
    description: pass, fail, error or skipped.
    value: ${{ steps.check.outputs.result }}
  run-url:
    description: The run in BrandLint.
    value: ${{ steps.check.outputs.run-url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - name: Install the BrandLint command line tool
      shell: bash
      run: |
        python -m pip install --require-hashes --no-deps -r "${{ github.action_path }}/requirements.txt"
        python -m pip install --no-deps "${{ github.action_path }}/../../cli"
    - name: Check the copy
      id: check
      shell: bash
      env:
        BRANDLINT_TOKEN: ${{ inputs.token }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ON_ERROR: ${{ inputs.on-error }}
        INPUT_ON_FORK: ${{ inputs.on-fork }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python "${{ github.action_path }}/run.py"
